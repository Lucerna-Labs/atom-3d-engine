name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: core (fmt · clippy · build · test)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format (whole workspace)
        run: cargo fmt --all -- --check
      - name: Clippy core and release client (deny warnings)
        run: cargo clippy -p mm3e-kit -p mm3e-orchestrator -p lucerna-release-client --all-targets -- -D warnings
      - name: Build core and release client
        run: cargo build --release -p mm3e-kit -p mm3e-orchestrator -p lucerna-release-client --all-targets
      - name: Test core and release client
        run: cargo test --release -p mm3e-kit -p mm3e-orchestrator -p lucerna-release-client

  gpu:
    name: gpu backend (build · clippy, Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy gpu (deny warnings)
        run: cargo clippy -p mm3e-gpu --all-targets -- -D warnings
      # Builds (compiles WGSL codegen + wgpu); does not run, since CI runners have no GPU.
      - name: Build gpu
        run: cargo build --release -p mm3e-gpu --all-targets
