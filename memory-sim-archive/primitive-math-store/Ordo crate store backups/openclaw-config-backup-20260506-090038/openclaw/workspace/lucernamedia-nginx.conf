server {
  listen 443 ssl;
  http2 on;
  ssl_certificate /etc/nginx/certs/lucernamedia.com.pem;
  ssl_certificate_key /etc/nginx/certs/lucernamedia.com.key;
  server_name lucernamedia.com www.lucernamedia.com;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

  client_header_buffer_size 32k;
  large_client_header_buffers 4 64k;
  underscores_in_headers on;

  include /usr/local/openresty/nginx/conf/error-pages.conf;

  location / {

    content_by_lua_block {
        ngx.header['server'] = 'Elestio'
    }
    access_by_lua_block {
        ngx.header['server'] = 'Elestio'
    }

    if ($is_rsc_form_request) {
      return 403;
    }

    limit_req zone=iprl burst=1000000 nodelay;
    limit_req_log_level warn;

    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
    proxy_connect_timeout 180s;
    keepalive_timeout 180s;

    proxy_http_version 1.1;
    proxy_pass http://172.17.0.1:2368;
    proxy_ssl_verify  off;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port  $server_port;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_cache_bypass $http_upgrade;
    proxy_hide_header x-powered-by;

    proxy_set_header Authorization $http_authorization;
  }
}