[package]
name = "lucerna-release-client"
version = "0.1.0"
edition = "2021"
description = "Opt-in, checksum-verified release client shared by Lucerna Labs applications."
license = "MIT"

[dependencies]
semver = "1.0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "3.3.0", default-features = false, features = ["rustls"] }
zip = { version = "6.0.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
